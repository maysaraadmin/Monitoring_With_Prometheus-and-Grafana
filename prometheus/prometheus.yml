global:
  scrape_interval: 30s

rule_files:
  - alert_rules.yml

alerting:
  alertmanagers:
    - scheme: http
      static_configs:
        - targets: [ 'alertmanager:9093' ]

scrape_configs:
  - job_name: 'prometheus'
    scrape_interval: 1m
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

  # Added 2026-11-16 (I-011, S0.7). Without this job, Alertmanager's own
  # metrics are not collected, so nothing can alert on notifications failing.
  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']

  - job_name: 'dummy_node'
    static_configs:
      - targets: ['localhost:1234']

  # Remote VPS host metrics. Targets live in prometheus/targets/vps.yml, which
  # is gitignored: this repo is public and the file holds real addresses (S7.5).
  # Copy targets/vps.yml.example to targets/vps.yml and add your servers, then
  # `docker compose restart prometheus`. No edit to this file is needed.
  # If the file does not exist, Prometheus logs a warning and carries on.
  - job_name: 'vps'
    file_sd_configs:
      - files: ['/etc/prometheus/targets/vps.yml']
        refresh_interval: 1m
    # A compromised or broken target must not be able to exhaust the collector
    # by returning a huge or high-cardinality response (S7.6).
    sample_limit: 5000
    label_limit: 30

  - job_name: 'blackbox'
    metrics_path: /probe
    params:
      module: [http_2xx]  # Look for a HTTP 200 response.
    # The deliberately-failing demo target (http://example.com:8080) was removed
    # on the user's instruction 2026-11-16, now that real sites are monitored.
    # This supersedes the website half of D-004 -- see D-016.
    #
    # Sites are listed in prometheus/targets/sites.yml, gitignored so the domains
    # you own are not published in this repo (S7.7). Needs nothing installed on
    # the server and works through NAT.
    file_sd_configs:
      - files: ['/etc/prometheus/targets/sites.yml']
        refresh_interval: 1m
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115  # The blackbox exporter's real hostname:port.
