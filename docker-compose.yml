networks:
  monitoring:
    driver: bridge
volumes:
  prometheus_data: {}
  grafana_data: {}
  alertmanager-data: {}

services:
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    # No published port, deliberately (S0.6). Prometheus scrapes it as
    # node-exporter:9100 over the `monitoring` network. Publishing it again
    # exposes a host inventory to anyone on the LAN. See docs/Decisions.md D-010.
    networks:
      - monitoring

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus:/etc/prometheus/
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    # --web.enable-lifecycle removed deliberately (S0.1): it let any caller
    # POST /-/reload. Reload config with `docker compose restart prometheus`.
    ports:
      # Loopback only, deliberately (S0.1). Prometheus has no authentication
      # of any kind; 0.0.0.0 hands every metric and the reload endpoint to the
      # LAN. See docs/Decisions.md D-010.
      - 127.0.0.1:9090:9090
    networks:
      - monitoring

  alertmanager:
    image: prom/alertmanager:latest
    restart: unless-stopped
    container_name: alertmgr
    ports:
      # Loopback only, deliberately (S0.5). Unauthenticated: anyone who can
      # reach this can silence every alert. See docs/Decisions.md D-010.
      - 127.0.0.1:9093:9093
    volumes:
      - "./alertmanager:/config"
      - alertmanager-data:/data
      # Untracked, .gitignore'd (S0.3). The SMTP password must never live in
      # alertmanager.yml, which is committed to a public repo.
      - ./secrets:/run/secrets:ro
    command: --config.file=/config/alertmanager.yml --log.level=debug
    networks:
      - monitoring
 
  blackbox:
    image: prom/blackbox-exporter:latest
    # privileged: true
    restart: unless-stopped
    container_name: Blackbox
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml
    # No published port, deliberately, and this is the most important line in
    # the file (S0.4). Published, /probe?target=... is an unauthenticated SSRF
    # relay: it fetches any URL a caller names, from inside the network.
    # Prometheus reaches it as blackbox:9115 over the `monitoring` network.
    networks:
      - monitoring
      
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    user: '0'
    # Credentials come from .env.local, which is untracked (S0.2, S0.3).
    # Copy .env.local.example to .env.local and set a real password.
    env_file:
      - .env.local
    environment:
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/node_exporter.json
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      # Loopback only, deliberately (S0.2). See docs/Decisions.md D-010.
      - 127.0.0.1:3001:3000
    restart: unless-stopped
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    networks:
      - monitoring
