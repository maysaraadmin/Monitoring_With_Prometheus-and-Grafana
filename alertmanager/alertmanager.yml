route:
  receiver: 'Mail Alert'
  # group_by: [ job ]
  repeat_interval: 30s
  group_wait: 15s
  group_interval: 15s

receivers:
  - name: 'Mail Alert'
    email_configs:
      - smarthost: 'smtp.gmail.com:587'
        auth_username: '<your email id here>'
        # Never put the password here: this file is committed to a public repo
        # (S0.3). The file below is mounted from ./secrets, which is gitignored.
        auth_password_file: /run/secrets/smtp_password
        from: '<your email id here>'
        to: "<receiver email id here>"
        headers:
          subject: 'Prometheus Mail Alerts'